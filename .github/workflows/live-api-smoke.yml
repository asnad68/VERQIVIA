name: VERQIVIA Live API Smoke Test

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Bare HTTPS origin of the deployed VERQIVIA API (no path)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verqivia-live-api-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run safe live API smoke checks
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
        run: python scripts/smoke_test_live_api.py --api-origin "$API_ORIGIN"
