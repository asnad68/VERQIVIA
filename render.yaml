# VERQIVIA deployment blueprint
# This file prepares the production topology; applying it still requires
# an authorized Render workspace and real external authentication settings.

services:
  - type: web
    name: verqivia-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    numInstances: 1
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    preDeployCommand: python scripts/migrate_postgres.py
    envVars:
      - key: NOTHING_STORAGE_BACKEND
        value: postgres
      - key: NOTHING_AUTH_MODE
        value: oidc-jwt
      - key: NOTHING_TENANCY_MODE
        value: single-tenant
      - key: NOTHING_API_HOST
        value: 0.0.0.0
      - key: NOTHING_API_PORT
        value: 8080
      - key: NOTHING_POSTGRES_DSN
        fromDatabase:
          name: verqivia-postgres
          property: connectionString
      - key: NOTHING_AUTH_ISSUER
        sync: false
      - key: NOTHING_AUTH_AUDIENCE
        sync: false
      - key: NOTHING_AUTH_JWKS_URI
        sync: false
      - key: NOTHING_AUTH_REQUIRED_SCOPE
        value: nothing:ingest
      - key: NOTHING_AUTH_ALLOWED_ALGORITHMS
        value: RS256
      - key: NOTHING_WRITE_ALLOWED_ORIGINS
        value: https://asnad68.github.io
      - key: NOTHING_BILLING_ENABLED
        value: "false"
      - key: NOTHING_DOMAIN_CHALLENGE_SECRET
        generateValue: true
      - key: NOTHING_PUBLIC_SITE_ORIGIN
        value: https://asnad68.github.io/VERQIVIA
      - key: NOTHING_PUBLIC_API_ORIGIN
        sync: false
      - key: NOTHING_TRUST_PROXY_HEADERS
        value: false
      - key: NOTHING_IDENTITY_CONTROL_ENABLED
        value: false
      - key: NOTHING_WALLET_AUTH_ENABLED
        value: false
      - key: NOTHING_ENROLLMENT_ENABLED
        value: false

databases:
  - name: verqivia-postgres
    databaseName: verqivia_prod
    user: verqivia_runtime
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    diskSizeGB: 5
    diskAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
